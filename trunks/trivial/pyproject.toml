[project]
name = "arbol-trunk-trivial"
version = "1.0.0"
description = "The Trivial Trunk: the default Trunk of every Arbol Root, one Driver run for each Chat Exchange."
requires-python = "==3.14.8"
dependencies = ["psycopg[binary]==3.3.6"]

[dependency-groups]
dev = ["mypy==1.19.1", "ruff==0.14.14"]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = ["src"]
files = ["src/arbol_trunk_trivial", "tests", "scripts", "bin/entry.py"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
